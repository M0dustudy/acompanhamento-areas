<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123d2d">
<title>VITRA — Controle de Qualidade</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#f4f7f5}
body{display:flex;flex-direction:column}
header{flex:0 0 auto;min-height:57px;padding:7px 10px;padding-top:max(7px,env(safe-area-inset-top));display:flex;align-items:center;gap:9px;background:#103e2c;color:#fff;box-shadow:0 1px 6px #0002;z-index:2}
.logo{display:grid;place-items:center;width:35px;height:35px;flex:none;border:1px solid #ffffff50;border-radius:11px;background:linear-gradient(145deg,#35895e,#174d38);font-size:24px;font-weight:900}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.brandtext{min-width:0;line-height:1.06}
.brandtext strong{display:block;font-size:15px;letter-spacing:.08em}
.brandtext small{display:block;margin-top:4px;font-size:10px;color:#c7e6d3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#connection{color:#d3eadc;font-size:10px;white-space:nowrap;max-width:100px;overflow:hidden;text-overflow:ellipsis}
button{appearance:none;border:1px solid #ffffff40;color:white;background:#ffffff12;border-radius:10px;min-height:35px;min-width:35px;font-weight:650;font-size:12px;padding:5px 10px}
button:disabled{opacity:.5}button:active{background:#ffffff30}
#back{display:none;font-size:20px;padding:0}
#view{border:0;background:#f4f7f5;width:100%;flex:1;min-height:0}
#toast{position:absolute;z-index:4;top:66px;left:12px;right:12px;display:none;background:#f4faf6;border:1px solid #a4ccb3;border-radius:11px;padding:12px;color:#173d2b;box-shadow:0 4px 20px #0002;font-size:12px;line-height:1.5}
#toast button{background:#256f48;border:0;margin-top:7px}
#toast[data-show="true"]{display:block}
@media(max-width:370px){.brandtext small{display:none}#connection{font-size:9px}}
</style></head>
<body>
<header>
<button id="back" aria-label="Voltar ao VITRA">‹</button>
<div class="brand"><div class="logo" aria-hidden="true">V</div><div class="brandtext"><strong>VITRA</strong><small>Inteligência e Rastreabilidade da Uva</small></div></div>
<span id="connection" role="status">Iniciando</span>
<button id="sync" aria-label="Sincronizar avaliações">Atualizar</button>
</header>
<div id="toast" role="status"><span id="toastMessage"></span><div><button id="apply" type="button">Abrir atualização</button></div></div>
<iframe id="view" src="./dashboard.html" title="Sistema VITRA" referrerpolicy="no-referrer"></iframe>
<script src="./app.js" defer></script>
</body></html>

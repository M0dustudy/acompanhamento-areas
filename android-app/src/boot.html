<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#103e2c">
<title>VITRA — Controle de Qualidade</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#103e2c}
body{display:flex;flex-direction:column;
 padding-top:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));
 padding-bottom:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}
#view{display:block;flex:1;min-height:0;border:0;width:100%;background:#f1f5f2}
#sync-status{position:fixed;bottom:calc(16px + max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px)));right:16px;
 z-index:30;display:flex;align-items:center;justify-content:center;gap:6px;
 min-height:28px;min-width:28px;padding:5px 8px;border-radius:999px;
 background:rgba(255,255,255,.95);border:1px solid #d9e9de;color:#235d3d;
 box-shadow:0 2px 9px #102c1915;font-size:10px;font-weight:700;
 pointer-events:none;opacity:0;transform:translateY(5px);
 transition:opacity .14s ease,transform .14s ease}
#sync-status.visible{opacity:.96;transform:translateY(0)}
#sync-status[data-mode="loading"]{width:30px;height:30px;min-width:30px;padding:0}
#sync-status[data-mode="loading"] #sync-label{display:none}
#sync-status[data-mode="loading"]::before{content:"";width:13px;height:13px;
 border:2px solid #bad6c3;border-top-color:#26744d;border-radius:50%;
 animation:vitra-sync-spin .65s linear infinite}
#sync-status[data-mode="success"]::before{content:"✓";font-size:11px;font-weight:900}
@keyframes vitra-sync-spin{to{transform:rotate(360deg)}}
</style>
</head><body>
<iframe id="view" src="./dashboard.html" title="VITRA — Inteligência e Rastreabilidade da Uva"></iframe>
<div id="sync-status" role="status" aria-live="polite" aria-atomic="true"><span id="sync-label"></span></div>
<script src="./app.js" defer></script>
</body></html>

<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#103e2c">
<title>VITRA — Controle de Qualidade</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#f1f5f2}
#view{display:block;border:0;width:100%;height:100dvh;background:#f1f5f2}
#sync-status{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;z-index:30;
 pointer-events:none;opacity:0;transform:translateY(-6px);transition:opacity .2s ease,transform .2s ease;
 max-width:65vw;border:1px solid #cae1d1;border-radius:999px;background:#ecf5ef;
 padding:7px 12px;color:#215438;font-size:11px;font-weight:700;
 box-shadow:0 2px 9px #102c1911;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sync-status.visible{opacity:.96;transform:translateY(0)}
</style>
</head><body>
<iframe id="view" src="./dashboard.html" title="VITRA — Inteligência e Rastreabilidade da Uva"></iframe>
<div id="sync-status" role="status" aria-live="polite" aria-atomic="true"></div>
<script src="./app.js" defer></script>
</body></html>

let stockOpen=false,stockDetail=false,stockEvidence=false,stockGroup="",stockLot="",stockReport="",stockFilter="all",stockSearch="";

function stockDateValue(s){const m=String(s||"").match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?Number(m[3])*10000+Number(m[2])*100+Number(m[1]):0}
function stockGroups(){const m=new Map();stockData.forEach(x=>{if(!m.has(x.group))m.set(x.group,[]);m.get(x.group).push(x)});return [...m.entries()].sort((a,b)=>stockDateValue(b[1][0].date)-stockDateValue(a[1][0].date))}
function toggleStockDetail(g){stockGroup=g;stockDetail=true;const rows=stockData.filter(x=>x.group===g);stockLot=rows[0].lot;stockReport=rows[0].id;renderStock()}
function chooseLot(l){stockLot=l;const x=stockData.find(r=>r.group===stockGroup&&r.lot===l);if(x)stockReport=x.id;renderStock()}
function chooseReport(id){stockReport=id;renderStock()}function closeStockDetail(){stockDetail=false;stockGroup="";stockLot="";stockReport="";renderStock();requestAnimationFrame(()=>document.querySelector("#stockSearch")?.focus())}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function stockFilteredGroups(){const allGroups=stockGroups();return allGroups.map(([g,rows])=>[g,rows.filter(x=>(stockFilter==="all"||x.origin===stockFilter)&&([x.producer,x.variety,x.lot,x.pallet,x.group,x.market,x.class,x.date,x.packing].join(" ").toLowerCase().includes(stockSearch.toLowerCase())))]).filter(([g,rows])=>rows.length)}
function stockCardsHtml(){return stockFilteredGroups().map(([g,rows])=>{const lots=[...new Set(rows.map(x=>x.lot))];return '<div class="stockitem" data-g="'+esc(g)+'"><div class="stocktop"><div><b>'+esc(g)+'</b><div class="meta" style="text-align:left">'+(lots.length>1?lots.map(l=>'Lote '+esc(l)).join(' / '):'Lote '+esc(lots[0]))+'</div></div><span class="stockbadge">'+esc(rows[rows.length-1].summary)+'</span></div></div>'}).join("")||'<div class="note">Nenhum resultado encontrado.</div>'}
function stockSearchHtml(){if(!stockSearch.trim())return "";const rows=stockData.filter(x=>[x.producer,x.variety,x.lot,x.pallet,x.group,x.market,x.class,x.date,x.packing].join(" ").toLowerCase().includes(stockSearch.toLowerCase())).sort((a,b)=>stockDateValue(b.date)-stockDateValue(a.date)).slice(0,10);return rows.map(x=>'<button data-stock-group="'+esc(x.group)+'" data-stock-id="'+esc(x.id)+'"><b>'+esc(x.producer)+'</b> · '+esc(x.variety)+' · Lote '+esc(x.lot)+' · '+esc(x.date)+'</button>').join("")||'<div class="note">Nenhum resultado encontrado.</div>'}

tionRange(ssi.value.length,ssi.value.length)}p.querySelectorAll("button[data-filter]").forEach(el=>el.addEventListener("click",()=>setStockFilter(el.dataset.filter)));bindStockCards();if(stockSearch.trim())updateStockResults();p.querySelectorAll("button[data-lot]").forEach(el=>el.addEventListener("click",()=>chooseLot(el.dataset.lot)));p.querySelectorAll("button[data-report]").forEach(el=>el.addEventListener("click",()=>chooseReport(el.dataset.report)));const close=p.querySelector("#closeStockDetail");if(close)close.addEventListener("click",closeStockDetail)}

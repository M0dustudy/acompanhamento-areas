  const lines=(x||"").split("|");
  const pl=lines.find(y=>/^Predominância:/i.test(y.trim()));
  let name=pl?pl.replace(/^Predominância:\s*/i,"").replace(/\.$/,"").trim():"";

    const z=y.trim().toLowerCase();
    if(z.startsWith("verde:")) return "🟢 ";
    if(z.startsWith("âmbar:")) return "🟠 ";
    if(z.startsWith("negra:")||z.startsWith("negro:")) return "⚫ ";
    if(z.startsWith("vermelha:")||z.startsWith("vermelho:")) return "🔴 ";
    if(z.startsWith("rosado:")||z.startsWith("rosada:")) return `<span class="dot-rosado"></span>`;
    return "";
  };
  return lines.map(y=>{
    const isPred=name && !/desuniformidade/i.test(name) && y.toLowerCase().startsWith(name.toLowerCase()+":");
    return `<div class="${isPred?'line predline':'line'}">${isPred?'<span style="font-size:9px">★</span> ':''}${icon(y)}${y}</div>`;
  }).join("");

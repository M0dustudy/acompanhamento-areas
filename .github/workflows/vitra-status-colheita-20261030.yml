name: VITRA atualizar status de colheita 2026-10-30
on:
  push:
    paths:
      - '.github/workflows/vitra-status-colheita-20261030.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar status das áreas via Contents API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -sS --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/M0dustudy/acompanhamento-areas/contents/index.html?ref=main" -o /tmp/meta.json
          python3 - <<'PY'
          from pathlib import Path
          import base64, json
          meta=json.loads(Path('/tmp/meta.json').read_text())
          html=base64.b64decode(meta['content']).decode('utf-8')
          old='const groups={"acomp":["101A","303A","110A","110B","307A","307B","306A","306B","303B","301A","301B","109A","106A","302B"],"colh":["102A"],"pausa":["302A","211A"],"fim":["202A","202B","108A","108B","203A","107A","107B","203B","106B","109B","102B","211B","101B"]};'
          new='const groups={"acomp":["303A","110A","110B","307A","307B","306A","306B","303B","301A","301B","106A","302B"],"colh":["101A","102A","109A","211A"],"pausa":["302A"],"fim":["202A","202B","108A","108B","203A","107A","107B","203B","106B","109B","102B","211B","101B"]};'
          if old not in html:
              raise SystemExit('Bloco groups atual não corresponde ao esperado; nenhuma alteração feita.')
          html=html.replace(old,new,1)
          Path('/tmp/new_index.html').write_text(html, encoding='utf-8')
          Path('/tmp/sha').write_text(meta['sha'])
          PY
          python3 - <<'PY'
          import base64,json,os,urllib.request
          from pathlib import Path
          content=base64.b64encode(Path('/tmp/new_index.html').read_bytes()).decode()
          sha=Path('/tmp/sha').read_text().strip()
          data=json.dumps({'message':'VITRA: mover 101A, 109A e 211A para em colheita','content':content,'sha':sha,'branch':'main'}).encode()
          req=urllib.request.Request('https://api.github.com/repos/M0dustudy/acompanhamento-areas/contents/index.html',data=data,method='PUT',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req) as r:
              result=json.load(r)
          print('COMMIT='+result['commit']['sha'])
          PY

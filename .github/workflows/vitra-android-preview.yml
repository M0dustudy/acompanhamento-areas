name: VITRA Android - APK de teste

on:
  push:
    branches:
      - feature/vitra-android-preview
    paths:
      - "android-app/**"
      - ".github/workflows/vitra-android-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar SDK Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependências
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Criar projeto Android
        working-directory: android-app
        run: npx cap add android

      - name: Incorporar VITRA e personalizar ícone
        working-directory: android-app
        run: |
          node prepare.mjs
          npx cap sync android
          node icon.mjs

      - name: Compilar APK de testes
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: VITRA-Android-Preview-APK
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

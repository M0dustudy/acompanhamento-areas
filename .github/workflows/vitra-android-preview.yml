name: VITRA Android - APK de teste

on:
  push:
    branches:
      - feature/vitra-android-preview
    paths:
      - "android-app/**"
      - ".github/workflows/vitra-android-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Clonar apenas o código e os recursos do aplicativo
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /visualizador.html
            /vitra-access.css
            /vitra-labels-smart.css
            /vitra-access-config.js
            /vitra-access.js
            /vitra-labels-smart.js
            /imagens/
            /android-app/
            /vitra-areas.js
            /vitra-areas.css
            /scripts/vitra-area-sync.mjs

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar SDK Android
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -n "$SDKMGR" || { echo "SDK Manager não encontrado"; exit 1; }
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Verificar código e autenticação da API
        run: |
          node --check vitra-areas.js
          node --check vitra-access.js
          node --check android-app/src/app.js
          node --check android-app/prepare.mjs
          node --check scripts/vitra-area-sync.mjs
          node android-app/test-areas.mjs
          node -e 'fetch("https://avzdnzzohryokzyrxnap.supabase.co/functions/v1/vitra-areas?scope=publish").then(async r=>{const j=await r.json();if(!r.ok||!j.ok||!Array.isArray(j.events))throw Error("Endpoint indisponível");console.log("API de áreas ativa, eventos:",j.events.length)}).catch(e=>{console.error(e);process.exit(1)})'

      - name: Instalar dependências
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Criar projeto Android
        working-directory: android-app
        run: npx cap add android

      - name: Incorporar VITRA e personalizar ícone
        working-directory: android-app
        run: |
          node prepare.mjs
          npx cap sync android
          node icon.mjs

      - name: Definir código de versão para atualização do aplicativo existente
        working-directory: android-app
        run: |
          grep -q "versionCode 1" android/app/build.gradle || { echo "Código Android inesperado"; exit 1; }
          sed -i 's/versionCode 1/versionCode 3/' android/app/build.gradle
          grep "versionCode 3" android/app/build.gradle

      - name: Compilar APK de testes
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: VITRA-Android-Preview-APK
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

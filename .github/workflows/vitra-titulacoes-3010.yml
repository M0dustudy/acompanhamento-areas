name: VITRA titulações 30 outubro
on:
  push:
    paths:
      - '.github/workflows/vitra-titulacoes-3010.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar apenas titulações
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64,json,os,urllib.request
          u='https://api.github.com/repos/M0dustudy/acompanhamento-areas/contents/index.html'
          h={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          with urllib.request.urlopen(urllib.request.Request(u+'?ref=main',headers=h)) as r: meta=json.load(r)
          html=base64.b64decode(meta['content']).decode()
          new=json.loads("{\"101A|30/10\":{\"poda\":\"13/07/2026\",\"idade\":109,\"observacao\":\"A área apresenta predominância de cachos verdes.\",\"rows\":[[\"1 a 8\",\"Madura\",\"17\",\"0,87\",\"20\"],[\"9 a 16\",\"Madura\",\"17\",\"0,84\",\"20\"],[\"17 a 24\",\"Madura\",\"17,2\",\"0,87\",\"20\"],[\"25 a 30\",\"Madura\",\"18,2\",\"0,80\",\"23\"],[\"1 a 8\",\"Verde\",\"15,6\",\"0,95\",\"17\"],[\"9 a 16\",\"Verde\",\"16\",\"0,89\",\"18\"],[\"17 a 24\",\"Verde\",\"15,4\",\"0,90\",\"17\"],[\"25 a 30\",\"Verde\",\"16,4\",\"0,87\",\"19\"]]},\"110A|29/10\":{\"poda\":\"15/06/2026\",\"idade\":136,\"observacao\":\"A área apresenta predominância de cachos verdes.\",\"rows\":[[\"1 a 8\",\"Madura\",\"15,8\",\"0,21\",\"75\"],[\"9 a 16\",\"Madura\",\"16\",\"0,20\",\"80\"],[\"17 a 24\",\"Madura\",\"16\",\"0,23\",\"71\"],[\"25 a 32\",\"Madura\",\"16\",\"0,21\",\"76\"],[\"33 a 40\",\"Madura\",\"14,6\",\"0,23\",\"65\"],[\"1 a 8\",\"Verde\",\"15\",\"0,24\",\"63\"],[\"9 a 16\",\"Verde\",\"14,4\",\"0,23\",\"63\"],[\"17 a 24\",\"Verde\",\"14,8\",\"0,26\",\"58\"],[\"25 a 32\",\"Verde\",\"14,2\",\"0,26\",\"55\"],[\"33 a 40\",\"Verde\",\"13,6\",\"0,30\",\"45\"]]},\"303A|29/10\":{\"poda\":\"06/07/2026\",\"idade\":115,\"observacao\":\"A área apresenta predominância de cachos verdes.\",\"rows\":[[\"1 a 8\",\"Madura\",\"16,4\",\"0,72\",\"23\"],[\"9 a 16\",\"Madura\",\"17\",\"0,71\",\"24\"],[\"17 a 24\",\"Madura\",\"15,8\",\"0,77\",\"21\"],[\"25 a 32\",\"Madura\",\"14,2\",\"0,87\",\"16\"],[\"33 a 40\",\"Madura\",\"14,6\",\"0,81\",\"18\"],[\"1 a 8\",\"Verde\",\"16\",\"0,89\",\"18\"],[\"9 a 16\",\"Verde\",\"15\",\"0,83\",\"18\"],[\"17 a 24\",\"Verde\",\"14,2\",\"0,84\",\"17\"],[\"25 a 32\",\"Verde\",\"14,2\",\"0,93\",\"15\"],[\"33 a 40\",\"Verde\",\"13,8\",\"0,98\",\"14\"]]}}")
          anchor='}}};\n/* Apresentação dos registros por rua:'
          assert anchor in html, 'Estrutura não encontrada'
          for key in new:
           assert '"'+key+'":' not in html, 'Duplicidade: '+key
          insert=','.join(json.dumps(k,ensure_ascii=False)+':'+json.dumps(v,ensure_ascii=False,separators=(',',':')) for k,v in new.items())
          html=html.replace(anchor,'},'+insert+'}};\n/* Apresentação dos registros por rua:',1)
          data=json.dumps({'message':'VITRA: incluir titulações 101A 30/10, 110A e 303A 29/10','content':base64.b64encode(html.encode()).decode(),'sha':meta['sha'],'branch':'main'}).encode()
          with urllib.request.urlopen(urllib.request.Request(u,data=data,headers=h,method='PUT')) as r: print(json.load(r)['commit']['sha'])
          
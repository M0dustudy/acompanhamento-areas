name: VITRA - verificacao de integridade
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    name: Conferir avaliações e documentos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            index.html
            scripts
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verificar integridade sem alterar registros
        run: node scripts/validar-vitra.mjs

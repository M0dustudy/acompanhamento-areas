name: VITRA diagnostico 109A
on:
  push:
    branches: [main]
    paths: [".github/vitra-recepcao-109a.trigger"]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: index.html
          sparse-checkout-cone-mode: false
      - name: Diagnosticar bloco 109A
        run: |
          set -x
          { echo "PWD=$(pwd)"; echo "FILES:"; ls -la; echo "INDEX_EXISTS=$(test -f index.html && echo yes || echo no)"; echo "INDEX_SIZE=$(wc -c < index.html 2>/dev/null || echo 0)"; echo "COUNT_109A=$(grep -o '\"109A\":{' index.html 2>/dev/null | wc -l || echo 0)"; echo "COUNT_110A=$(grep -o '\"110A\":{' index.html 2>/dev/null | wc -l || echo 0)"; echo "HAS_R=$(grep -o '\"r\":\[' index.html 2>/dev/null | wc -l || echo 0)"; } > /tmp/vitra-diag.txt
          git config user.name "VITRA Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/vitra-diag.txt .github/vitra-recepcao-109a-diag.txt
          git add .github/vitra-recepcao-109a-diag.txt
          git commit -m "chore: diagnosticar bloco 109A"
          git push

name: VITRA diagnostico git 109A
on: push
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: index.html
          sparse-checkout-cone-mode: false
      - name: Diagnóstico git
        run: |
          set +e
          echo "PWD=$(pwd)" > .github/vitra-git-diag.txt
          echo "LS=" >> .github/vitra-git-diag.txt
          ls -la >> .github/vitra-git-diag.txt 2>&1
          echo "GIT_SHOW_EXIT:" >> .github/vitra-git-diag.txt
          git show HEAD:index.html > /tmp/index.html 2>>.github/vitra-git-diag.txt
          echo $? >> .github/vitra-git-diag.txt
          echo "TMP_SIZE=$(wc -c < /tmp/index.html 2>/dev/null)" >> .github/vitra-git-diag.txt
          echo "GIT_FILES:" >> .github/vitra-git-diag.txt
          git ls-tree --name-only HEAD >> .github/vitra-git-diag.txt 2>&1
          git config user.name "VITRA Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/vitra-git-diag.txt
          git commit -m "chore: diagnóstico git da recepção 109A" || true
          git push || true

name: VITRA recepcao 109A
on: push
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: index.html
          sparse-checkout-cone-mode: false
      - name: Atualizar via arquivo raw + Contents API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git ls-tree HEAD index.html
          git ls-tree HEAD index.html | awk '{print $3}' > /tmp/index_sha
          curl -L --fail --silent --show-error https://raw.githubusercontent.com/M0dustudy/acompanhamento-areas/main/index.html -o /tmp/index.html
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, os, re, urllib.request
          p=Path('/tmp/index.html'); s=p.read_text(encoding='utf-8')
          if '3ª viagem · 29/10/2026' in s:
              print('A avaliação já está cadastrada; nada a fazer.')
              raise SystemExit(0)
          entry='[\"3ª viagem · 29/10/2026\",\"Extra A 40,0% · Extra 60,0%\",\"Verde: Brix médio 13,6|Âmbar: Brix médio 15,4|Predominância: cachos verdes.\",\"A fruta apresenta quantidade elevada de cachos translúcidos, quantidade moderada de cicatrizes e bagas rachadas! Além disso, cachos com queima do sol, bagas podres, manchas foliares, bagas com desuniformidade, danos de cigarrinha e bagas com danos mecânicos.\"]'
          m=re.search(r'("109A":\{.*?)(\},"110A":\{)',s,re.S)
          if not m: raise SystemExit('Bloco 109A não localizado')
          block=m.group(1)
          if '"r":[' in block: raise SystemExit('109A já possui histórico de recepção; atualização interrompida')
          newblock=block[:-1]+',"r":['+entry+']}'
          p.write_text(s[:m.start(1)]+newblock+s[m.end(1):],encoding='utf-8')
          sha=Path('/tmp/index_sha').read_text().strip()
          repo='M0dustudy/acompanhamento-areas'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'}
          payload={'message':'VITRA: registrar recepção 109A em 29/10/2026','content':base64.b64encode(p.read_bytes()).decode('ascii'),'sha':sha,'branch':'main'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/index.html',data=json.dumps(payload).encode('utf-8'),headers=headers,method='PUT')
          result=json.load(urllib.request.urlopen(req))
          print('COMMIT='+result['commit']['sha'])
          PY

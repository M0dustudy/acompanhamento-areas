name: VITRA diagnostico 109A
on: push
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspecionar bloco 109A
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/M0dustudy/acompanhamento-areas/contents/index.html?ref=main" -o /tmp/meta.json
          python3 - <<'PY'
          from pathlib import Path
          import base64,json,re
          meta=json.loads(Path('/tmp/meta.json').read_text())
          html=base64.b64decode(meta['content']).decode('utf-8')
          m=re.search(r'("109A":\{.*?)(\},"110A":\{)',html,re.S)
          print('SHA='+meta['sha'])
          print('MATCH='+str(bool(m)))
          if m:
              block=m.group(1)
              print('BLOCK='+block)
              print('HAS_DATE='+str('3ª viagem · 29/10/2026' in block))
              print('HAS_R='+str('"r":[' in block))
          PY

name: VITRA diagnostico 109A
on:
  push:
    branches: [main]
    paths: [".github/vitra-recepcao-109a.trigger"]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: index.html
          sparse-checkout-cone-mode: false
      - name: Diagnosticar bloco 109A
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'("109A":\{.*?)(\},"110A":\{)',s,re.S)
          out=[]
          out.append('SIZE='+str(len(s)))
          out.append('HAS_109A='+str(s.count('"109A":{')))
          out.append('HAS_110A='+str(s.count('"110A":{')))
          out.append('REGEX_MATCH='+str(bool(m)))
          if m:
            out.append('BLOCK_SIZE='+str(len(m.group(1))))
            out.append('HAS_R='+str('"r":[' in m.group(1)))
            out.append('HAS_DATE='+str('3ª viagem · 29/10/2026' in m.group(1)))
          Path('/tmp/vitra-diag.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          git config user.name "VITRA Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/vitra-diag.txt .github/vitra-recepcao-109a-diag.txt
          git add .github/vitra-recepcao-109a-diag.txt
          git commit -m "chore: diagnosticar bloco 109A"
          git push

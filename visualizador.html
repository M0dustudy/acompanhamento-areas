),zoomEl=document.getElementById("zoom");let pdf=null,zoom=1;async function render(){if(!pdf)return;pages.innerHTML="";status.textContent="Renderizando "+pdf.numPages+" página(s)…";const maxWidth=Math.max(280,Math.min(900,document.documentElement.clientWidth-20));for(let n=1;n<=pdf.numPages;n++){const page=await pdf.getPage(n);const base=page.getViewport({scale:1});const viewport=page.getViewport({scale:(maxWidth/base.width)*zoom});const dpr=Math.min(window.devicePixelRatio||1,2);const canvas=document.createElement("canvas");canvas.className="page";canvas.width=Math.floor(viewport.width*dpr);canvas.height=Math.floor(viewport.height*dpr);canvas.style.width=Math.floor(viewport.width)+"px";canvas.style.height=Math.floor(viewport.height)+"px";pages.appendChild(canvas);await page.render({canvasContext:canvas.getContext("2d"),viewport,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null}).promise;}status.textContent="Relatório exibido online · "+pdf.numPages+" página(s)";zoomEl.textContent=Math.round(zoom*100)+"%";}try{const pdfjsLib=await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs");pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";pdf=await pdfjsLib.getDocument(url).promise;await render();}catch(e){status.textContent="Não foi possível carregar a visualização.";pages.innerHTML='<div class="err"><b>Falha na visualização online.</b><br>Volte ao dashboard; o relatório original continua preservado.</div>';}document.getElementById("plus").addEventListener("click",async()=>{zoom=Math.min(1.8,zoom+.15);await render();});document.getElementById("minus").addEventListener("click",async()=>{zoom=Math.max(.7,zoom-.15);await render();});</script></body></html>
